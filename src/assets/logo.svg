<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none" class="w-auto h-8">
  <style>
    .bill-text {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 28px;
      stroke: #111111;
      stroke-width: 1.6;
      fill: transparent;
